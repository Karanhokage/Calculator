<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculator</title>
<style>
:root{
  --bg:#e9ecef; --body:#dee2e6; --key:#f8f9fa; --key-hover:#ffffff; --key-text:#212529;
  --op:#868e96; --op-text:#f8f9fa; --eq:#212529; --eq-text:#f8f9fa;
  --screen:#212529; --screen-text:#f1f3f5; --screen-dim:#868e96; --fn:#ced4da;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181a; --body:#212529; --key:#343a40; --key-hover:#495057; --key-text:#f1f3f5;
    --op:#6c757d; --op-text:#f8f9fa; --eq:#f1f3f5; --eq-text:#16181a;
    --screen:#0d0e0f; --screen-text:#f1f3f5; --screen-dim:#868e96; --fn:#495057;
  }
}
:root[data-theme="dark"]{
  --bg:#16181a; --body:#212529; --key:#343a40; --key-hover:#495057; --key-text:#f1f3f5;
  --op:#6c757d; --op-text:#f8f9fa; --eq:#f1f3f5; --eq-text:#16181a;
  --screen:#0d0e0f; --screen-text:#f1f3f5; --screen-dim:#868e96; --fn:#495057;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;
  font-family:"Helvetica Neue",Arial,sans-serif;padding:16px}
.calc{width:100%;max-width:340px;background:var(--body);border-radius:24px;padding:18px;
  box-shadow:0 20px 40px rgba(0,0,0,.18)}
.screen{background:var(--screen);border-radius:14px;padding:16px 18px;margin-bottom:16px;
  text-align:right;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.expr{color:var(--screen-dim);font-size:16px;min-height:20px;word-break:break-all}
.out{color:var(--screen-text);font-size:44px;font-weight:300;line-height:1.1;word-break:break-all}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{font:inherit;font-size:22px;height:62px;border:0;border-radius:14px;cursor:pointer;
  background:var(--key);color:var(--key-text);transition:transform .08s,background .15s}
button:hover{background:var(--key-hover)}
button:active{transform:scale(.95)}
button:focus-visible{outline:3px solid var(--op);outline-offset:2px}
.fn{background:var(--fn)}
.op{background:var(--op);color:var(--op-text)}
.op:hover{background:var(--op);filter:brightness(1.12)}
.eq{background:var(--eq);color:var(--eq-text)}
.eq:hover{background:var(--eq);filter:brightness(1.25)}
.zero{grid-column:span 2}
</style>
</head>
<body>
<main class="calc" aria-label="Calculator">
  <div class="screen" aria-live="polite">
    <div class="expr" id="expr"></div>
    <div class="out" id="out">0</div>
  </div>
  <div class="keys" id="keys">
    <button class="fn" data-k="C">AC</button>
    <button class="fn" data-k="neg">+/−</button>
    <button class="fn" data-k="pct">%</button>
    <button class="op" data-k="/">÷</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="op" data-k="*">×</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button class="op" data-k="-">−</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button class="op" data-k="+">+</button>
    <button class="zero" data-k="0">0</button>
    <button data-k=".">.</button>
    <button class="eq" data-k="=">=</button>
  </div>
</main>
<script>
(function(){
  var out=document.getElementById('out'), expr=document.getElementById('expr');
  var cur='0', prev=null, op=null, fresh=false;
  var sym={'+':'+','-':'−','*':'×','/':'÷'};
  function fmt(s){
    if(s==='Error')return s;
    var n=parseFloat(s); if(!isFinite(n))return 'Error';
    if(s.indexOf('.')>-1&&s.slice(-1)==='.')return s;
    if(Math.abs(n)>=1e12||(Math.abs(n)<1e-9&&n!==0))return n.toExponential(5);
    var parts=s.split('.'); parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
    return parts.join('.');
  }
  function show(){ out.textContent=fmt(cur); out.style.fontSize=out.textContent.length>11?'28px':(out.textContent.length>8?'36px':'44px'); }
  function calc(a,b,o){
    a=parseFloat(a); b=parseFloat(b); var r;
    if(o==='+')r=a+b; else if(o==='-')r=a-b; else if(o==='*')r=a*b;
    else r=b===0?NaN:a/b;
    return isFinite(r)?String(parseFloat(r.toPrecision(12))):'Error';
  }
  function press(k){
    if(cur==='Error'&&k!=='C')cur='0';
    if(k>='0'&&k<='9'&&k.length===1){
      if(fresh||cur==='0'){cur=k;fresh=false;} else if(cur.replace(/[-.]/g,'').length<12)cur+=k;
    } else if(k==='.'){
      if(fresh){cur='0.';fresh=false;} else if(cur.indexOf('.')<0)cur+='.';
    } else if(k==='C'){cur='0';prev=null;op=null;fresh=false;expr.textContent='';
    } else if(k==='neg'){ if(cur!=='0')cur=cur[0]==='-'?cur.slice(1):'-'+cur;
    } else if(k==='pct'){ cur=String(parseFloat((parseFloat(cur)/100).toPrecision(12)));
    } else if(k==='='){
      if(op!==null&&prev!==null){
        expr.textContent=fmt(prev)+' '+sym[op]+' '+fmt(cur)+' =';
        cur=calc(prev,cur,op); prev=null; op=null; fresh=true;
      }
    } else {
      if(op!==null&&prev!==null&&!fresh){cur=calc(prev,cur,op);}
      prev=cur; op=k; fresh=true;
      expr.textContent=fmt(prev)+' '+sym[op];
    }
    show();
  }
  document.getElementById('keys').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(b)press(b.dataset.k);
  });
  document.addEventListener('keydown',function(e){
    var k=e.key;
    if(/^[0-9.]$/.test(k)||'+-*/'.indexOf(k)>-1)press(k);
    else if(k==='Enter'||k==='='){e.preventDefault();press('=');}
    else if(k==='Backspace'){cur=cur.length>1&&!fresh?cur.slice(0,-1):'0'; if(cur==='-')cur='0'; show();}
    else if(k==='Escape')press('C');
    else if(k==='%')press('pct');
  });
  show();
})();
</script>
</body>
</html>
